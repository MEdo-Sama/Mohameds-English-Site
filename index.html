    // ==========================================
    // 2. APPLICATION STATE & STORAGE
    // ==========================================
    let currentLevel = "A1";
    let currentUnitIndex = 0;
    let currentTab = "vocab";
    let vocabViewMode = "cards"; // 'cards' or 'table'
    let audioSpeed = 1.0;
    let showListeningTranscript = false;
    let userProgress = JSON.parse(localStorage.getItem("enAcademyProgress_v1")) || {
      points: 0,
      completedQuizzes: {}
    };

    function saveProgress() {
      localStorage.setItem("enAcademyProgress_v1", JSON.stringify(userProgress));
      document.getElementById("userPoints").innerText = userProgress.points;
    }

    function resetProgress() {
      if (confirm("هل تريد إعادة ضبط نقاطك وتقدمك من البداية؟")) {
        userProgress = { points: 0, completedQuizzes: {} };
        saveProgress();
        renderAll();
      }
    }

    function toggleDarkMode() {
      const htmlEl = document.documentElement;
      const icon = document.getElementById("themeIcon");
      htmlEl.classList.toggle("dark");
      if (htmlEl.classList.contains("dark")) {
        icon.className = "fa-solid fa-sun";
      } else {
        icon.className = "fa-solid fa-moon";
      }
    }

    // ==========================================
    // 3. TEXT-TO-SPEECH (TTS) ENGINE
    // ==========================================
    function speakEnglish(text, rate = 1.0) {
      if (!('speechSynthesis' in window)) {
        alert("متصفحك لا يدعم القراءة الصوتية التلقائية.");
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-US";
      utterance.rate = rate;
      window.speechSynthesis.speak(utterance);
    }

    function stopSpeech() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    // ==========================================
    // 4. UI RENDERING FUNCTIONS
    // ==========================================
    function selectLevel(lvl) {
      stopSpeech();
      currentLevel = lvl;
      currentUnitIndex = 0;
      renderAll();
    }

    function selectUnit(index) {
      stopSpeech();
      currentUnitIndex = index;
      renderAll();
    }

    function switchTab(tabName) {
      stopSpeech();
      currentTab = tabName;
      renderModuleTabs();
      renderModuleContent();
    }

    function getActiveUnit() {
      return curriculumData[currentLevel].units[currentUnitIndex];
    }

    function renderLevelAndUnitBars() {
      const levelObj = curriculumData[currentLevel];
      document.getElementById("currentLevelTitle").innerText = levelObj.nameAr;

      // Level Buttons
      const levels = ["A1", "A2", "B1", "B2"];
      const lvlContainer = document.getElementById("levelButtonsContainer");
      lvlContainer.innerHTML = levels.map(lvl => {
        const isActive = lvl === currentLevel;
        return `
          <button onclick="selectLevel('${lvl}')"
            class="px-4 py-2 rounded-xl font-bold text-sm sm:text-base transition flex items-center justify-center gap-2 ${
              isActive
                ? 'bg-white text-indigo-950 shadow-lg scale-105'
                : 'bg-indigo-800/70 text-indigo-200 hover:bg-indigo-800'
            }">
            <span class="en-text font-extrabold">${lvl}</span>
          </button>
        `;
      }).join("");

      // Unit Buttons
      const unitContainer = document.getElementById("unitButtonsContainer");
      unitContainer.innerHTML = levelObj.units.map((u, idx) => {
        const isCurrent = idx === currentUnitIndex;
        const isDone = userProgress.completedQuizzes[u.id];
        return `
          <button onclick="selectUnit(${idx})"
            class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition flex items-center gap-2 ${
              isCurrent
                ? 'bg-amber-400 text-slate-950 shadow'
                : 'bg-indigo-950/60 text-indigo-200 hover:bg-indigo-950'
            }">
            <span>${u.titleAr}</span>
            ${isDone ? '<i class="fa-solid fa-circle-check text-emerald-500"></i>' : ''}
          </button>
        `;
      }).join("");
    }

    function renderModuleTabs() {
      const tabs = ['vocab', 'grammar', 'listening', 'speaking', 'writing', 'quiz'];
      tabs.forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === currentTab) {
          btn.className = "module-tab flex items-center justify-center gap-2 py-3 px-4 rounded-xl font-bold text-sm transition bg-indigo-600 text-white shadow-md scale-[1.02]";
        } else {
          btn.className = "module-tab flex items-center justify-center gap-2 py-3 px-4 rounded-xl font-bold text-sm transition bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100";
        }
      });
    }

    // ==========================================
    // 5. RENDER EACH OF THE 6 MODULES
    // ==========================================
    function renderModuleContent() {
      const unit = getActiveUnit();
      const container = document.getElementById("moduleContentArea");

      if (currentTab === "vocab") {
        renderVocabModule(unit, container);
      } else if (currentTab === "grammar") {
        renderGrammarModule(unit, container);
      } else if (currentTab === "listening") {
        renderListeningModule(unit, container);
      } else if (currentTab === "speaking") {
        renderSpeakingModule(unit, container);
      } else if (currentTab === "writing") {

    function startSpeechRecognition(idx, targetSentence) {
      const resultBox = document.getElementById(`speak-result-${idx}`);
      const micBtn = document.getElementById(`mic-btn-${idx}`);
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        const manualInput = prompt("متصفحك الحالي لا يدعم المايكروفون المباشر. اكتب الجملة أو ما نطقته لتجربة مصحح النطق الذكي:", targetSentence);
        if (manualInput) {
          evaluateSpokenText(idx, targetSentence, manualInput);
        }
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      micBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الاستماع...';
      resultBox.classList.remove("hidden");
      resultBox.innerHTML = '<span class="text-amber-600 font-bold">انطق الجملة بالإنجليزية الآن...</span>';

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        evaluateSpokenText(idx, targetSentence, transcript);
      };

      recognition.onerror = () => {
        micBtn.innerHTML = '<i class="fa-solid fa-microphone"></i> تحدث الآن';
        resultBox.innerHTML = '<span class="text-rose-600 font-bold">تعذر التقاط الصوت. تأكد من السماح بالمايكروفون أو أن الموقع يعمل عبر رابط https.</span>';
      };

      recognition.onend = () => {
        micBtn.innerHTML = '<i class="fa-solid fa-microphone"></i> تحدث الآن';
      };

      recognition.start();
    }

    function evaluateSpokenText(idx, targetSentence, spokenText) {
      const resultBox = document.getElementById(`speak-result-${idx}`);
      resultBox.classList.remove("hidden");

      const cleanTarget = targetSentence.toLowerCase().replace(/[^a-z0-9\s]/g, "").trim().split(/\s+/);
      const cleanSpoken = spokenText.toLowerCase().replace(/[^a-z0-9\s]/g, "").trim().split(/\s+/);

      let matchedCount = 0;
      const coloredWordsHtml = cleanTarget.map(word => {
        if (cleanSpoken.includes(word)) {
          matchedCount++;
          return `<span class="px-2 py-0.5 rounded bg-emerald-100 dark:bg-emerald-900/60 text-emerald-700 dark:text-emerald-300 font-bold">${word}</span>`;
        } else {
          return `<span class="px-2 py-0.5 rounded bg-rose-100 dark:bg-rose-900/60 text-rose-700 dark:text-rose-300 font-bold">${word}</span>`;
        }
      }).join(" ");

      const accuracy = Math.round((matchedCount / cleanTarget.length) * 100);

      resultBox.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-2 mb-2 border-b border-slate-200 dark:border-slate-700">
          <div>ما التقطه المايكروفون: <strong class="en-text text-indigo-600 dark:text-indigo-400">"${spokenText}"</strong></div>
          <span class="px-3 py-1 rounded-full text-xs font-extrabold ${accuracy >= 75 ? 'bg-emerald-500 text-white' : 'bg-amber-500 text-slate-950'}">
            نسبة دقة النطق: ${accuracy}%
          </span>
        </div>
        <div class="text-xs text-slate-500 mb-1">تحليل الكلمات (الأخضر = نطق سليم، الأحمر = تحتاج لإعادتها):</div>
        <div class="en-text flex flex-wrap gap-1.5 mt-1">${coloredWordsHtml}</div>
      `;
    }

        <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
          <div class="text-xs font-bold text-slate-500">
            عدد الكلمات المكتوبة: <span id="wordCountSpan" class="text-indigo-600 font-extrabold">0</span> كلمة
          </div>
          <div class="flex items-center gap-2">
            <button onclick="checkWritingRules()" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs sm:text-sm shadow transition">
              <i class="fa-solid fa-spell-check"></i> فحص النص وتقييمه
            </button>
            <button onclick="document.getElementById('modelAnswerBox').classList.toggle('hidden')" class="px-4 py-2.5 rounded-xl bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 font-bold text-xs sm:text-sm transition">
              إظهار نموذج إجابة
            </button>
          </div>
        </div>

        <div id="writingFeedbackBox" class="hidden p-4 rounded-xl mb-4 text-sm"></div>

        <div id="modelAnswerBox" class="hidden p-4 rounded-xl bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-800">
          <div class="text-xs font-bold text-emerald-700 dark:text-emerald-400 mb-1">نموذج إجابة مقترح (Model Answer):</div>
          <p class="en-text text-sm sm:text-base font-medium">${w.modelAnswerEn}</p>
        </div>
      `;
    }

    function analyzeWritingInput() {
      const unit = getActiveUnit();
      const text = document.getElementById("writingTextarea").value;
      const words = text.trim() ? text.trim().split(/\s+/) : [];
      document.getElementById("wordCountSpan").innerText = words.length;

      const lowerText = text.toLowerCase();
      unit.writing.targetWords.forEach(tw => {
        const chip = document.getElementById(`chip-${tw.toLowerCase()}`);
        if (lowerText.includes(tw.toLowerCase())) {
          chip.className = "en-text px-3 py-1 rounded-full text-xs font-bold bg-emerald-500 text-white shadow";
          chip.innerHTML = `<i class="fa-solid fa-check mr-1"></i> ${tw}`;
        } else {
          chip.className = "en-text px-3 py-1 rounded-full text-xs font-bold bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300";
          chip.innerText = tw;
        }
      });
    }

    function checkWritingRules() {
      const unit = getActiveUnit();
      const text = document.getElementById("writingTextarea").value.trim();
      const feedbackBox = document.getElementById("writingFeedbackBox");
      feedbackBox.classList.remove("hidden");

      if (text.length < 15) {
        feedbackBox.className = "p-4 rounded-xl mb-4 text-sm bg-rose-50 text-rose-700 border border-rose-200 font-bold";
        feedbackBox.innerText = "النص قصير جداً! حاول كتابة جملتين كاملتين على الأقل.";
        return;
      }

      const usedWords = unit.writing.targetWords.filter(tw => text.toLowerCase().includes(tw.toLowerCase()));
      const startsWithCapital = /^[A-Z]/.test(text);
      const endsWithPeriod = /[.!?]$/.test(text);

      let notes = [];
      notes.push(`✅ استخدمت (${usedWords.length} من ${unit.writing.targetWords.length}) من الكلمات المستهدفة في الوحدة.`);
      if (!startsWithCapital) notes.push("⚠️ تذكر أن تبدأ الجملة الإنجليزية بحرف كبير (Capital Letter).");
      if (!endsWithPeriod) notes.push("⚠️ لا تنسَ وضع نقطة (.) في نهاية الفقرة.");
      if (startsWithCapital && endsWithPeriod && usedWords.length >= 2) {
        notes.push("🌟 كتابة ممتازة ومنظمة! يمكنك أيضاً مقارنة إجابتك بالنموذج الاسترشادي.");
      }

      feedbackBox.className = "p-4 rounded-xl mb-4 text-sm bg-indigo-50 dark:bg-indigo-950/60 text-slate-800 dark:text-slate-200 border border-indigo-200 space-y-1 font-medium";
      feedbackBox.innerHTML = notes.map(n => `<div>${n}</div>`).join("");
    }

    // --- MODULE 6: QUIZ & ASSESSMENT ---
    function renderQuizModule(unit, container) {
      container.innerHTML = `
        <div class="pb-5 mb-6 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
          <div>
            <span class="text-xs font-bold text-indigo-600 dark:text-indigo-400">القسم السادس: الاختبار الشامل للوحدة (Unit Test)</span>
            <h3 class="text-xl font-extrabold mt-0.5">اختبر مدى إتقانك للكلمات والقواعد</h3>
          </div>
          <span class="text-xs font-bold px-3 py-1.5 rounded-full bg-amber-100 text-amber-800">النجاح من 75%</span>
        </div>

        <form id="quizForm" onsubmit="submitUnitQuiz(event)" class="space-y-5">
          ${unit.quiz.map((q, qIdx) => `
            <div class="p-5 rounded-2xl bg-slate-50 dark:bg-slate-700/40 border border-slate-200 dark:border-slate-600">
              <div class="text-xs font-bold text-indigo-600 dark:text-indigo-400 mb-1">السؤال ${qIdx + 1}: ${q.qAr}</div>
              <div class="en-text font-extrabold text-base sm:text-lg mb-4">${q.qEn}</div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                ${q.options.map((opt, oIdx) => `
                  <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 cursor-pointer hover:border-indigo-500 transition">
                    <input type="radio" name="q_${qIdx}" value="${oIdx}" required class="w-4 h-4 text-indigo-600" />
                    <span class="font-semibold text-sm">${opt}</span>
                  </label>
                `).join("")}
              </div>
              <div id="quiz-explain-${qIdx}" class="hidden mt-3 p-3 rounded-xl text-xs font-bold"></div>
            </div>
          `).join("")}

          <button type="submit" class="w-full py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-base shadow-lg transition">
            تصحيح الاختبار وإظهار النتيجة والشرح
          </button>
        </form>

        <div id="quizSummaryResult" class="hidden mt-6 p-6 rounded-2xl text-center"></div>
      `;
    }

    function submitUnitQuiz(e) {
      e.preventDefault();
      const unit = getActiveUnit();
      const formData = new FormData(e.target);
      let correctCount = 0;

      unit.quiz.forEach((q, qIdx) => {
        const userAns = parseInt(formData.get(`q_${qIdx}`));
        const explainBox = document.getElementById(`quiz-explain-${qIdx}`);
        explainBox.classList.remove("hidden");

        if (userAns === q.correct) {
          correctCount++;
          explainBox.className = "mt-3 p-3 rounded-xl text-xs font-bold bg-emerald-100 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-300";
          explainBox.innerHTML = `✅ إجابة صحيحة! ${q.explanationAr}`;
        } else {
          explainBox.className = "mt-3 p-3 rounded-xl text-xs font-bold bg-rose-100 dark:bg-rose-950/60 text-rose-800 dark:text-rose-300";
          explainBox.innerHTML = `❌ إجابة خاطئة. الإجابة الصحيحة هي (${q.options[q.correct]}). — ${q.explanationAr}`;
        }
      });

      const scorePercent = Math.round((correctCount / unit.quiz.length) * 100);
      const summaryBox = document.getElementById("quizSummaryResult");
      summaryBox.classList.remove("hidden");

      if (scorePercent >= 75) {
        if (!userProgress.completedQuizzes[unit.id]) {
          userProgress.completedQuizzes[unit.id] = true;
          userProgress.points += 50;
          saveProgress();
          renderLevelAndUnitBars();
        }
        summaryBox.className = "mt-6 p-6 rounded-2xl text-center bg-emerald-600 text-white shadow-lg";
        summaryBox.innerHTML = `
          <div class="text-3xl font-extrabold mb-1">🎉 أحسنت! نتيجتك: ${scorePercent}%</div>
          <p class="text-sm opacity-95">لقد اجتزت اختبار هذه الوحدة بنجاح وحصلت على نقاط التقدم.</p>
        `;
      } else {
        summaryBox.className = "mt-6 p-6 rounded-2xl text-center bg-amber-500 text-slate-950 shadow-lg";
        summaryBox.innerHTML = `
          <div class="text-2xl font-extrabold mb-1">نتيجتك: ${scorePercent}%</div>
          <p class="text-sm font-semibold">راجع الشرح العربي للأخطاء بالأعلى وحاول مرة أخرى للوصول إلى 75% أو أكثر.</p>
        `;
      }
    }

    // ==========================================
    // 6. INITIALIZATION
    // ==========================================
    function renderAll() {
      document.getElementById("userPoints").innerText = userProgress.points;
      renderLevelAndUnitBars();
      renderModuleTabs();
      renderModuleContent();
    }

    window.addEventListener("DOMContentLoaded", renderAll);
  </script>
</body>
</html>
